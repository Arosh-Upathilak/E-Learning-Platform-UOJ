name: ELP-UOJ

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cd backend
          echo "MONGODB_URL=${{ secrets.MONGODB_URL }}" > .env
          echo "PORT=5000" >> .env
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "FRONTEND_URL_DEVELOPMENT_URL=${{ secrets.FRONTEND_URL_DEVELOPMENT_URL }}" >> .env

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Restart backend with PM2 (FIXED)
        run: |
          pm2 delete backend || true
          pm2 start backend/index.js --name backend 
          pm2 save

      - name: Restart ngrok (FIXED)
        run: |
          pkill ngrok || true
          nohup /usr/local/bin/ngrok http 5000 > /home/ubuntu/ngrok.log 2>&1 &
          sleep 5

      - name: Print ngrok HTTPS URL
        run: |
          curl -s http://127.0.0.1:4040/api/tunnels \
            | grep -o 'https://[^"]*ngrok[^"]*'
